# Glint configuration for self-analysis
version: 1

settings:
  exclude:
    - "vendor/*"
    - "node_modules/*"
  min_severity: low
  output: console

categories:
  architecture:
    enabled: true
    rules:
      # Increased thresholds for complex rule implementations
      cyclomatic-complexity:
        enabled: true
        settings:
          # Higher threshold for AST analyzer rules - pattern matching is inherently complex
          max_complexity: 30
      long-function:
        enabled: true
        settings:
          max_lines: 200
      deep-nesting:
        enabled: true
        settings:
          max_depth: 5
      # solid-srp: too strict for analyzer rules that naturally have multiple responsibilities
      solid-srp:
        enabled: false

  patterns:
    enabled: true
    rules:
      test-email-registrable-domain:
        exceptions:
          - file: "pkg/rules/patterns/test_reliability_ts_test.go"
            reason: >-
              The addresses on registrable domains are the inputs of the
              rule's own test: the test checks that the rule reports them.
          - file: "pkg/rules/patterns/test_email_domain_sql_test.go"
            reason: >-
              The SQL patterns on registrable domains are the inputs of the
              rule's own test: the test checks that the rule reports them.
      mock-identifier:
        exceptions:
          - files: "pkg/rules/deadcode/{stub_method,nil_return_stub}.go"
            reason: >-
              These rules detect stub methods: "Stub" in their names is the
              subject they report on, not a fake implementation in production.
      legacy-comment-marker:
        exceptions:
          - files: "pkg/rules/{patterns/legacy_comment_marker,patterns/legacy_identifier,deadcode/deprecated_comment}.go"
            reason: >-
              These rules detect the word legacy in comments and names: their
              documentation spells the markers they report, it admits no
              legacy code path.
      tombstone-comment:
        exceptions:
          - file: "pkg/rules/patterns/tombstone_comment.go"
            reason: >-
              The rule detects notes about deleted code: its documentation
              spells the words it reports, it annotates no deleted code.
      error-wrap:
        exceptions:
          - files: "pkg/core/**"
            reason: >-
              The loader, walker and config helpers each build their error with
              fmt.Errorf naming the operation and the path; wrapping again at
              the call site would only repeat that text.

  security:
    enabled: true
    rules:
      hardcoded-secret:
        exceptions:
          - files: "pkg/rules/security/hardcoded_secrets*_test.go"
            reason: >-
              The keys and passwords there are the samples the rule's own
              tests feed it; they are made up and the tests check that the
              rule reports them.

  deadcode:
    enabled: true

  typesafety:
    enabled: true
    rules:
      any-in-public-contract:
        exceptions:
          - file: "pkg/output/json.go"
            reason: >-
              Context carries the details of one finding as its rule records
              them: each rule has its own keys and values, so the report has
              no single schema for them.

  duplication:
    enabled: true
    rules:
      # Rule implementations share short traversal/guard scaffolding.
      cross-file-duplicate:
        enabled: true
        settings:
          min_block_size: 15
