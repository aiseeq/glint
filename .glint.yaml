# Glint configuration for self-analysis
version: 1

settings:
  exclude:
    - "vendor/*"
    - "node_modules/*"
  min_severity: medium
  output: console

categories:
  architecture:
    enabled: true
    rules:
      # Increased thresholds for complex rule implementations
      cyclomatic-complexity:
        enabled: true
        settings:
          # Higher threshold for AST analyzer rules - pattern matching is inherently complex
          max_complexity: 30
      long-function:
        enabled: true
        settings:
          max_lines: 200
      deep-nesting:
        enabled: true
        settings:
          max_depth: 5
      # solid-srp: too strict for analyzer rules that naturally have multiple responsibilities
      solid-srp:
        enabled: false

  patterns:
    enabled: true
    rules:
      test-email-registrable-domain:
        exceptions:
          - file: "pkg/rules/patterns/test_reliability_ts_test.go"
            reason: >-
              The addresses on registrable domains are the inputs of the
              rule's own test: the test checks that the rule reports them.
      mock-identifier:
        exceptions:
          - files: "pkg/rules/deadcode/{stub_method,nil_return_stub}.go"
            reason: >-
              These rules detect stub methods: "Stub" in their names is the
              subject they report on, not a fake implementation in production.
      error-wrap:
        exceptions:
          - files: "pkg/core/**"
            reason: >-
              The loader, walker and config helpers each build their error with
              fmt.Errorf naming the operation and the path; wrapping again at
              the call site would only repeat that text.
          - file: "audit_actor_propagation.go"
            reason: >-
              initialize/run/auditRoles already return errors naming the SSA
              function and the malformed sink.
      quadratic-loop:
        exceptions:
          - file: "multi_write_no_transaction.go"
            reason: >-
              The pairwise scan looks for two writes that are not in mutually
              exclusive branches — a property of the pair, not of either write
              alone. The collection is one function's writes, single digits in
              practice, so the shape cannot grow into a cost.

  security:
    enabled: true
    rules:
      hardcoded-secret:
        exceptions:
          - files: "pkg/rules/security/hardcoded_secrets*_test.go"
            reason: >-
              The keys and passwords there are the samples the rule's own
              tests feed it; they are made up and the tests check that the
              rule reports them.

  deadcode:
    enabled: true
    rules:
      unused-config-field:
        exceptions:
          - file: "pkg/core/config.go"
            pattern: "Exception.Reason"
            reason: >-
              Exception.Reason documents why a suppression exists for whoever
              reads .glint.yaml; the loader deliberately does not act on it.

  typesafety:
    enabled: true

  duplication:
    enabled: true
    rules:
      # Rule implementations share short traversal/guard scaffolding.
      cross-file-duplicate:
        enabled: true
        settings:
          min_block_size: 15
