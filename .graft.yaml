schema: 1
graft: '>=2.9.0'

# Versions are annotated tags vX.Y.Z (graft release); the build stamps
# graft version --describe into the binary.
version:
  mode: git-tag

gate:
  - task: smoke

# smoke vets with the pgquery_cgo tag the tests build with; graft's own vet
# runs untagged, a separate build configuration the cache does not share, and
# repeated the whole analysis of the same single module (about 60 CPU-s).
go_vet:
  enabled: false
  reason: smoke runs go vet ./... with the build tags of the tests; the untagged vet repeated it

# Go tasks build the SQL parser natively (cgo): the WebAssembly one a plain
# go install gets costs a second and hundreds of MB on every run that parses SQL.
tasks:
  # --- build ---
  build:
    desc: build the binary into bin/
    heavy: true
    env: {GOFLAGS: -tags=pgquery_cgo}
    run:
      - [go, build, -ldflags, '-X main.version=${GRAFT_VERSION}', -o, bin/glint, ./cmd/glint]
  install:
    desc: install to ~/bin atomically (a running glint keeps its file)
    deps: [build]
    run:
      - sh: |
          set -eu
          mkdir -p "$HOME/bin"
          tmp=$(mktemp "$HOME/bin/.glint.XXXXXX")
          trap 'rm -f "$tmp"' EXIT
          install -m 0755 bin/glint "$tmp"
          mv -f "$tmp" "$HOME/bin/glint"
          echo "Installed to $HOME/bin/glint"
  install-gopath:
    desc: install to GOPATH/bin with go install
    heavy: true
    env: {GOFLAGS: -tags=pgquery_cgo}
    run:
      - [go, install, -ldflags, '-X main.version=${GRAFT_VERSION}', ./cmd/glint]
  clean:
    desc: remove build artifacts
    run:
      - rm -rf bin
      - go clean

  # --- tests ---
  test:
    desc: all tests
    heavy: true
    tests: go
    usage: <go test flags, e.g. -run TestX>
    env: {GOFLAGS: -tags=pgquery_cgo}
    run: ['go test -json -p {threads} -v {args} ./...']
  test-short:
    desc: tests without the long-running ones
    heavy: true
    env: {GOFLAGS: -tags=pgquery_cgo}
    run: ['go test -p {threads} -short -v ./...']
  test-race:
    desc: tests with the race detector (analysis runs rules in parallel)
    heavy: true
    tests: go
    env: {GOFLAGS: -tags=pgquery_cgo}
    run: ['go test -json -p {threads} -race ./...']
  test-coverage:
    desc: tests with a coverage report in coverage.html
    heavy: true
    env: {GOFLAGS: -tags=pgquery_cgo}
    run:
      - go test -p {threads} -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - ['echo', 'Coverage report: coverage.html']
  smoke:
    desc: the commit gate - fmt-check, vet, short tests
    run: [{task: fmt-check}, {task: vet}, {task: test-short}]

  # --- quality ---
  lint:
    desc: golangci-lint (installed on first use)
    heavy: true
    run:
      - sh: |
          set -eu
          if ! command -v golangci-lint >/dev/null 2>&1; then
            echo "Installing golangci-lint..."
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          fi
          golangci-lint run --concurrency {threads}
  fmt:
    desc: format the code
    run:
      - go fmt ./...
      - echo "Code formatted"
  fmt-check:
    desc: fail on unformatted code
    run:
      # Only the repository's files: ignored trees (agent worktrees, tmp) are
      # someone else's work in progress.
      - sh: 'test -z "$(git ls-files -co --exclude-standard -- "*.go" | xargs -r gofmt -l)" || { echo "Code is not formatted. Run graft fmt"; exit 1; }'
  vet:
    desc: go vet
    env: {GOFLAGS: -tags=pgquery_cgo}
    run: [go vet ./...]
  all:
    desc: every check - fmt-check, vet, lint, tests, race; before install
    run: [{task: fmt-check}, {task: vet}, {task: lint}, {task: test}, {task: test-race}]
  self-check:
    desc: glint on itself, built from this tree
    heavy: true
    usage: <glint check flags, e.g. --verbose>
    deps: [build]
    run: ['bin/glint check -j {threads} ./... {args}']

  # --- dependencies ---
  deps:
    desc: download dependencies
    run: [go mod download]
  deps-update:
    desc: update dependencies
    run:
      - go get -u ./...
      - go mod tidy
