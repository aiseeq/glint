schema: 1
graft: '>=2.37.0'

# Versions are annotated tags vX.Y.Z (graft release); the build stamps
# graft version --describe into the binary.
version:
  mode: git-tag

gate:
  - task: smoke

# graft's own vet runs with the tag the tests build with, so it shares their
# build cache; smoke does not vet again.
go_vet:
  env: {GOFLAGS: -tags=pgquery_cgo}

# go fix -diff ./... runs after go vet with its env: the modernizers of the
# toolchain leave no edits behind.
go_fix:
  enabled: true

# Go tasks build the SQL parser natively (cgo): the WebAssembly one a plain
# go install gets costs a second and hundreds of MB on every run that parses SQL.
#
# The checks skip a tree they already passed (cache): none of them changes
# anything outside the tree or reads a service. What decides their result
# besides the tree: the Go toolchain; for the tests and glint on itself also
# tsc and shellcheck, which rules run, and the approved models list
# model-not-approved reads; for lint the golangci-lint version.
tasks:
  # --- build ---
  build:
    desc: build the binary into bin/
    heavy: true
    env: {GOFLAGS: -tags=pgquery_cgo}
    run:
      - [go, build, -ldflags, '-X main.version=${GRAFT_VERSION}', -o, bin/glint, ./cmd/glint]
  install:
    desc: install to ~/bin atomically (a running glint keeps its file)
    deps: [build]
    run:
      - sh: |
          set -eu
          mkdir -p "$HOME/bin"
          tmp=$(mktemp "$HOME/bin/.glint.XXXXXX")
          trap 'rm -f "$tmp"' EXIT
          install -m 0755 bin/glint "$tmp"
          mv -f "$tmp" "$HOME/bin/glint"
          echo "Installed to $HOME/bin/glint"
  install-gopath:
    desc: install to GOPATH/bin with go install
    heavy: true
    env: {GOFLAGS: -tags=pgquery_cgo}
    run:
      - [go, install, -ldflags, '-X main.version=${GRAFT_VERSION}', ./cmd/glint]
  clean:
    desc: remove build artifacts
    run:
      - rm -rf bin
      - go clean

  # --- tests ---
  test:
    desc: all tests
    heavy: true
    cache: &tools_cache
      commands: [[go, version], [tsc, --version], [shellcheck, --version]]
      files: ['~/.config/models/approved']
    tests: go
    usage: <go test flags, e.g. -run TestX>
    env: {GOFLAGS: -tags=pgquery_cgo}
    run: ['go test -json -p {threads} -v {args} ./...']
  test-short:
    desc: tests without the long-running ones
    heavy: true
    cache: *tools_cache
    env: {GOFLAGS: -tags=pgquery_cgo}
    run: ['go test -p {threads} -short -v ./...']
  # Only the packages whose own code runs goroutines or takes locks: a rule
  # test runs one rule in one goroutine, and the race detector finds nothing
  # there. Rules run in parallel in cmd/glint (TestAnalyzeFilesIsDeterministicAndRaceFree
  # analyzes with every rule). A package that starts goroutines or guards
  # state with a lock joins this list.
  test-race:
    desc: tests with the race detector, packages with concurrent code (analysis runs rules in parallel)
    heavy: true
    cache: *tools_cache
    tests: go
    env: {GOFLAGS: -tags=pgquery_cgo}
    run: ['go test -json -p {threads} -race ./cmd/glint ./pkg/core ./pkg/rules ./pkg/sqlschema ./pkg/valueset ./pkg/rules/rulestest ./pkg/rules/duplication']
  test-coverage:
    desc: tests with a coverage report in coverage.html
    heavy: true
    env: {GOFLAGS: -tags=pgquery_cgo}
    run:
      - go test -p {threads} -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - ['echo', 'Coverage report: coverage.html']
  smoke:
    desc: the commit gate after graft's own vet - fmt-check, short tests
    cache: *tools_cache
    run: [{task: fmt-check}, {task: test-short}]

  # --- quality ---
  lint:
    desc: golangci-lint (installed on first use)
    heavy: true
    cache:
      commands: [[go, version], [golangci-lint, --version]]
    run:
      - sh: |
          set -eu
          if ! command -v golangci-lint >/dev/null 2>&1; then
            echo "Installing golangci-lint..."
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          fi
          golangci-lint run --concurrency {threads}
  fmt:
    desc: format the code
    run:
      - go fmt ./...
      - echo "Code formatted"
  fmt-check:
    desc: fail on unformatted code
    cache:
      commands: [[go, version]]
    run:
      # Only the repository's files: ignored trees (agent worktrees, tmp) are
      # someone else's work in progress.
      - sh: 'test -z "$(git ls-files -co --exclude-standard -- "*.go" | xargs -r gofmt -l)" || { echo "Code is not formatted. Run graft fmt"; exit 1; }'
  vet:
    desc: go vet
    cache:
      commands: [[go, version]]
    env: {GOFLAGS: -tags=pgquery_cgo}
    run: [go vet ./...]
  all:
    desc: every check - fmt-check, vet, lint, tests, race, glint on itself; before install
    run: [{task: fmt-check}, {task: vet}, {task: lint}, {task: test}, {task: test-race}, {task: self-check}]
  self-check:
    desc: glint on itself, built from this tree
    heavy: true
    cache: *tools_cache
    usage: <glint check flags, e.g. --verbose>
    deps: [build]
    run: ['bin/glint check -j {threads} ./... {args}']

  # --- dependencies ---
  deps:
    desc: download dependencies
    run: [go mod download]
  deps-update:
    desc: update dependencies
    run:
      - go get -u ./...
      - go mod tidy
